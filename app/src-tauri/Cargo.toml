[package]
name = "escarcell"
description = "Application de bureau €scarcell (Tauri v2)"
version = "0.4.0"
edition = "2021"
authors = ["ChatCarbo"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ChatCarbo/escarcell"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tauri-plugin-dialog = "2"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Sauvegarde chiffrée (0.4) : bibliothèques RustCrypto, aucun algorithme maison.
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"
# Lecture des classeurs Excel (.xlsx, .xls) et OpenDocument (.ods) pour l'import du PEA.
calamine = "0.26"
# zip 2.6 a changé son API en restant en 2.x (ZipFile<R>) et ne compile plus avec calamine 0.26 :
# version fixée à la dernière compatible, sans fonction supplémentaire (calamine active déjà « deflate »).
zip = { version = "=2.4.2", default-features = false }
escarcell-core = { path = "../../crates/escarcell-core" }
